<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Order Status</title>
    
    <!-- Fonts from 2nd Code -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        /* --- GLOBAL BODY (2nd Code Look) --- */
        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            margin: 0;
            min-height: 100vh;

            /* Background Image & Gradient */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            /* Layout Centering */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* --- CONTAINER (Glassmorphism) --- */
        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            
            /* Glass Effect */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- TYPOGRAPHY --- */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin: 10px 0 30px 0;
            letter-spacing: 1px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            margin-bottom: 40px;
        }

        /* --- FORMS & INPUTS --- */
        .info-section {
            margin: 30px auto;
            max-width: 100%;
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            justify-content: center; /* Center the input layout */
        }

        .info-row label {
            font-size: 1em;
            font-weight: 600;
            min-width: 140px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Styling text inputs */
        .info-row input[type="number"], 
        .info-row input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
            max-width: 400px;
        }

        .info-row input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .info-row input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Styling the Select Dropdown */
        .info-row select {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            outline: none;
            cursor: pointer;
            max-width: 400px;
        }
        
        .info-row select option {
            background-color: #2c3e50; /* Dark background for dropdown options */
            color: white;
        }

        /* --- ORDER DETAILS BOX --- */
        .order-details {
            background: rgba(0, 0, 0, 0.3); /* Darker than container for contrast */
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            margin: 30px auto;
            text-align: left;
        }

        .order-details h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .order-details p {
            font-size: 1.05em;
            margin: 10px 0;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .order-details h3 {
            margin-top: 20px;
            font-size: 1.2em;
            color: rgba(243, 156, 18, 0.9); /* Orange highlight */
        }

        /* --- BUTTONS --- */
        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }

        button, a.btn-primary, a.btn-secondary {
            width: 200px; /* Original width */
            min-width: 200px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Primary (Blue - Matching 2nd Code) */
        .btn-primary {
            background: rgba(76, 116, 134, 0.8);
            border: 1px solid rgba(76, 116, 134, 0.9);
        }

        .btn-primary:hover {
            background: rgba(76, 116, 134, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 116, 134, 0.4);
        }

        /* Secondary (Orange - Matching Logout style) */
        .btn-secondary {
            background: rgba(243, 156, 18, 0.8);
            border: 1px solid rgba(243, 156, 18, 0.9);
        }

        .btn-secondary:hover {
            background: rgba(243, 156, 18, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }

        .button-row {
            display: flex;
            gap: 40px;
            justify-content: center;
            width: 100%;
        }

        /* HR Styling inside Order Details */
        hr {
            border: none;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>UPDATE ORDER STATUS</h1>
        <div class="divider"></div>

        <!-- SEARCH FORM -->
        <form th:action="@{/admin/orders}" method="post">
            <div class="info-section">
                <div class="info-row">
                    <label>ORDER ID:</label>
                    <input type="number" name="orderId" placeholder="Enter Order ID">
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button type="submit" class="btn-primary">FETCH ORDER</button>
                </div>
            </div>
        </form>

        <!-- DISPLAY ORDER DETAILS (Only shows if order found) -->
        <div th:if="${order}" class="order-details">
            <h2>ORDER DETAILS:</h2>
            <p><strong>Order ID:</strong> <span th:text="${order.orderID}"></span></p>
            <p><strong>Customer:</strong> <span th:text="${order.customerName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${order.userEmail}"></span></p>
            <p><strong>Total Price:</strong> RM<span th:text="${order.totalPrice}"></span></p>
            <p><strong>Delivery Address:</strong> <span th:text="${order.deliveryAddress}"></span></p>
            <p><strong>Order Date:</strong> <span th:text="${order.orderDate}"></span></p>
            <p><strong>Current Status:</strong> <span th:text="${order.status}" style="color: #f39c12; font-weight: bold;"></span></p>
            
            <hr>
            <h3>Order Items:</h3>
            <div th:each="item : ${order.items}">
                <p style="margin: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;">
                    <span th:text="${item.title}" style="font-weight: 600;"></span> (bookID: <span th:text="${item.bookID}"></span>)<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;Quantity: <span th:text="${item.quantity}"></span> × RM<span th:text="${item.price}"></span> = RM<span th:text="${item.quantity * item.price}"></span>
                </p>
            </div>
        </div>

        <!-- UPDATE FORM (Only shows if order found) -->
        <div th:if="${order}" class="info-section">
            <form th:action="@{/admin/orders/update}" method="post">
                <input type="hidden" name="orderID" th:value="${order.orderID}">
                <div class="info-row">
                    <label>STATUS:</label>
                    <select name="status">
                        <option value="">Select Status</option>
                        <option value="PLACED">PLACED</option>
                        <option value="SHIPPED">SHIPPED</option>
                        <option value="OUT_FOR_DELIVERY">OUT FOR DELIVERY</option>
                        <option value="DELIVERED">DELIVERED</option>
                    </select>
                </div>
                <div class="button-group" style="margin-top: 30px;">
                    <div class="button-row">
                        <a th:href="@{/admin/dashboard}" class="btn-secondary" style="text-decoration:none; color:white;">CANCEL</a>
                        <button type="submit" class="btn-primary">UPDATE</button>
                    </div>
                </div>
            </form>
        </div>
        
        <!-- BACK BUTTON (Always visible) -->
        <div class="button-group" th:unless="${order}">
            <a th:href="@{/admin/dashboard}" class="btn-secondary" style="text-decoration: none; color: white;">BACK</a>
        </div>

    </div>

</body>
</html>
