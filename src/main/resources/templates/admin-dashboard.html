<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        /* SAME CSS FROM YOUR CODE */
        body {
            font-family: 'Georgia', serif;
            background-color: #f5e6d3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin: 30px 0;
            letter-spacing: 2px;
        }

        .divider {
            width: 100%;
            height: 3px;
            background-color: #000;
            margin-bottom: 50px;
        }

        .info-section {
            margin: 30px auto;
            max-width: 500px;
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .info-row label {
            font-size: 1.3em;
            font-weight: bold;
            min-width: 150px;
        }

        .info-row input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background-color: #b8a68f;
            color: #fff;
            font-size: 1em;
            font-family: 'Georgia', serif;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        button {
            width: 350px;
            padding: 18px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-family: 'Georgia', serif;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: #b8a68f;
            color: white;
        }

        .btn-secondary {
            background-color: #7a9098;
            color: white;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); transition: 0.3s; }
    </style>
</head>
<body>

    <div class="container">
        <h1>ADMIN DASHBOARD</h1>
        <div class="divider"></div>
        
        <div class="info-section">
            <div class="info-row">
                <label>NAME:</label>
                <!-- Data passed from Controller -->
                <input type="text" th:value="${adminName}" readonly>
            </div>
            
            <div class="info-row">
                <label>ADMIN ID:</label>
                <input type="text" th:value="${adminId}" readonly>
            </div>
            
            <div class="info-row">
                <label>EMAIL:</label>
                <input type="text" th:value="${adminEmail}" readonly>
            </div>
        </div>

        <div class="button-group">
            <!-- Links to other pages -->
            <a th:href="@{/admin/books}" class="btn-primary" style="text-decoration: none; color: white;">MANAGE BOOK</a>
            <a th:href="@{/admin/orders}" class="btn-primary" style="text-decoration: none; color: white;">UPDATE ORDER STATUS</a>
            <a th:href="@{/}" class="btn-primary" style="text-decoration: none; color: white;">PREVIEW MAIN PAGE</a>
            <a th:href="@{/logout}" class="btn-secondary" style="text-decoration: none; color: white;">LOGOUT</a>
        </div>
    </div>

</body>
</html>
