<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <!-- Fonts and Icons from 2nd Code -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        /* --- GLOBAL STYLES (From 2nd Code) --- */
        body {
            /* Background Image & Gradient from 2nd Code */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            /* Font from 2nd Code */
            font-family: 'Poppins', sans-serif;
            color: white;
            
            /* Original Layout Alignment */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* --- CONTAINER (Glassmorphism from 2nd Code) --- */
        .container {
            width: 100%;
            max-width: 600px; /* Adjusted slightly for the new style */
            
            /* Glass effect style from 2nd Code (.book-card) */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 50px;
            
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s ease;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            text-align: center;
            /* Font from 2nd Code headers */
            font-family: 'Playfair Display', serif;
            font-size: 2.5em;
            margin: 10px 0 30px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .divider {
            width: 100%;
            height: 1px;
            /* White divider with opacity */
            background-color: rgba(255, 255, 255, 0.2);
            margin-bottom: 40px;
        }

        /* --- INFO SECTION & INPUTS --- */
        .info-section {
            margin: 20px auto;
            max-width: 100%;
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .info-row label {
            font-size: 1em;
            font-weight: 600;
            min-width: 140px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        .info-row input {
            flex: 1;
            /* Input style based on 2nd Code search bar */
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 50px; /* Pill shape like search bar */
            color: white;
            font-size: 0.95em;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .info-row input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* Remove autofill background color for dark mode */
        .info-row input:-webkit-autofill,
        .info-row input:-webkit-autofill:hover, 
        .info-row input:-webkit-autofill:focus, 
        .info-row input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #2c3e50 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* --- BUTTONS --- */
        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
        }

        /* Generic anchor styling acting as buttons */
        a.btn-primary, a.btn-secondary {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 15px 20px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            display: inline-block;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        /* Primary Button (Blue-ish style from 2nd Code .btn-details) */
        .btn-primary {
            background: rgba(76, 116, 134, 0.8);
            border: 1px solid rgba(76, 116, 134, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            background: rgba(76, 116, 134, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 116, 134, 0.4);
            color: white;
        }

        /* Secondary Button (Orange style from 2nd Code .btn-cart) */
        .btn-secondary {
            background: rgba(243, 156, 18, 0.8);
            border: 1px solid rgba(243, 156, 18, 0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-secondary:hover {
            background: rgba(243, 156, 18, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
            color: white;
        }

    </style>
</head>
<body>

    <!-- The HTML Structure remains exactly the same as Code 1 -->
    <div class="container">
        <h1>ADMIN DASHBOARD</h1>
        <div class="divider"></div>
        
        <div class="info-section">
            <div class="info-row">
                <label>NAME:</label>
                <input type="text" th:value="${adminName}" readonly>
            </div>
            
            <div class="info-row">
                <label>ADMIN ID:</label>
                <input type="text" th:value="${adminId}" readonly>
            </div>
            
            <div class="info-row">
                <label>EMAIL:</label>
                <input type="text" th:value="${adminEmail}" readonly>
            </div>
        </div>

        <div class="button-group">
            <!-- 
                 Using the classes .btn-primary and .btn-secondary 
                 to trigger the new styling 
            -->
            <a th:href="@{/admin/books}" class="btn-primary">MANAGE BOOK</a>
            <a th:href="@{/admin/orders}" class="btn-primary">UPDATE ORDER STATUS</a>
            <a th:href="@{/}" class="btn-primary">PREVIEW MAIN PAGE</a>
            <a th:href="@{/logout}" class="btn-secondary">LOGOUT</a>
        </div>
    </div>

</body>
</html>
