<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Book | Bookstore Admin</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f5e6d3;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin: 30px 0;
            letter-spacing: 2px;
        }

        .divider {
            width: 100%;
            height: 3px;
            background-color: #000;
            margin-bottom: 50px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px 50px;
            margin: 50px auto;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background-color: #b8a68f;
            color: #fff;
            font-size: 1em;
            outline: none;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-field textarea {
            border-radius: 20px;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        button,
        .btn-back {
            width: 350px;
            padding: 18px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #b8a68f;
            color: white;
        }

        .btn-secondary {
            background-color: #7a9098;
            color: white;
        }

        .button-row {
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .image-preview img {
            max-width: 150px;
            border-radius: 10px;
            border: 3px solid #b8a68f;
        }

        /* Placeholder text color */
        .form-field input::placeholder,
        .form-field textarea::placeholder {
            color: #ffffff;
            opacity: 1;
            /* ensures full white instead of faded */
        }

        /* For better browser support */
        .form-field input::-webkit-input-placeholder,
        .form-field textarea::-webkit-input-placeholder {
            color: #ffffff;
        }

        .form-field input:-ms-input-placeholder,
        .form-field textarea:-ms-input-placeholder {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>MANAGE BOOK</h1>
        <div class="divider"></div>
        <div class="inventory-section" style="margin-bottom: 50px;">
            <form th:action="@{/admin/books}" method="get"
                style="display: flex; gap: 10px; margin-bottom: 30px; justify-content: center;">
                <input type="text" name="query" th:value="${currentQuery}"
                    placeholder="Search by Title, Author, or ISBN..."
                    style="flex: 1; max-width: 500px; background-color: #b8a68f; color: white; border-radius: 25px; padding: 12px 20px; border: none; outline: none;">
                <button type="submit" class="btn-primary" style="width: auto; padding: 10px 30px;">FIND BOOK</button>
            </form>

            <div th:if="${allBooks != null}" style="overflow-x: auto;">
                <h2 style="text-align: center; color: #b8a68f; font-size: 1.2em; margin-bottom: 20px;">SEARCH RESULTS
                </h2>

                <table th:if="${not #lists.isEmpty(allBooks)}"
                    style="width: 100%; border-collapse: collapse; font-family: 'Georgia', serif;">
                    <thead>
                        <tr style="background-color: #b8a68f; color: white;">
                            <th style="padding: 15px; text-align: left;">Title</th>
                            <th style="padding: 15px; text-align: left;">ISBN</th>
                            <th style="padding: 15px; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${allBooks}" style="border-bottom: 1px solid #eee;">
                            <td style="padding: 15px; font-weight: bold;" th:text="${book.title}"></td>
                            <td style="padding: 15px;" th:text="${book.isbn}"></td>
                            <td style="padding: 15px; text-align: center;">
                                <a th:href="@{/admin/books/edit/{id}(id=${book.bookID})}"
                                    style="color: #b8a68f; text-decoration: none; font-weight: bold; margin-right: 15px;">MODIFY</a>
                                <a th:href="@{/admin/books/delete/{id}(id=${book.bookID})}"
                                    onclick="return confirm('Remove this book?')"
                                    style="color: #7a9098; text-decoration: none; font-weight: bold;">REMOVE</a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:if="${#lists.isEmpty(allBooks)}" style="text-align: center; color: #7a9098;">
                    No book found with that name or ISBN.
                </p>
            </div>
        </div>
        <form th:action="@{/admin/books/add}" method="post" enctype="multipart/form-data" th:object="${bookForm}">
            <div class="form-grid">
                <div class="form-field">
                    <label>TITLE:</label>
                    <input type="text" th:field="*{title}" placeholder="Enter book title" required>
                </div>
                <div class="form-field">
                    <label>AUTHOR:</label>
                    <input type="text" th:field="*{author}" placeholder="Enter author name" required>
                </div>

                <div class="form-field">
                    <label>ISBN:</label>
                    <input type="text" th:field="*{isbn}" placeholder="Enter ISBN" required>
                </div>
                <div class="form-field">
                    <label>GENRE:</label>
                    <select th:field="*{genre}" required>
                        <option value="Classic Novel">Classic Novel</option>
                        <option value="Fantasy Novel">Fantasy Novel</option>
                        <option value="Personal Finance">Personal Finance</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="Programming">Programming</option>
                        <option value="History/Science">History/Science</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>PUBLISHER:</label>
                    <input type="text" th:field="*{publisher}" placeholder="Enter publisher">
                </div>
                <div class="form-field">
                    <label>PUBLISH YEAR:</label>
                    <input type="number" th:field="*{publicationYear}" placeholder="YYYY">
                </div>

                <div class="form-field">
                    <label>LANGUAGE:</label>
                    <input type="text" th:field="*{language}" placeholder="e.g. English">
                </div>
                <div class="form-field">
                    <label>PAGE COUNT:</label>
                    <input type="number" th:field="*{pageCount}" placeholder="0">
                </div>

                <div class="form-field">
                    <label>PRICE (RM):</label>
                    <input type="number" th:field="*{price}" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-field">
                    <label>STATUS:</label>
                    <select th:field="*{status}">
                        <option value="Available">Available</option>
                        <option value="Out of Stock">Out of Stock</option>
                    </select>
                </div>

                <div class="form-field full-width">
                    <label>TYPE (Format):</label>
                    <input type="text" th:field="*{type}" placeholder="e.g. Hardcover, E-Book">
                </div>

                <div class="form-field">
                    <label>
                        <input type="checkbox" th:field="*{isPromo}"> Mark as Promotion
                    </label>
                </div>

                <div class="form-field full-width">
                    <label>BOOK COVER:</label>
                    <input type="file" name="file" accept="image/*" onchange="previewBookCover(event)">
                    <div class="image-preview" id="coverPreview">
                        <img id="previewImage" src="" alt="Preview">
                        <p id="fileName" style="color: #666; font-size: 0.8em;"></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <div class="button-row">
                    <button type="reset" class="btn-secondary">RESET FORM</button>
                    <button type="submit" class="btn-primary">ADD BOOK</button>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn-secondary btn-back">BACK TO DASHBOARD</a>
            </div>
        </form>
    </div>

    <script>
        function previewBookCover(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('coverPreview');
            const previewImage = document.getElementById('previewImage');
            const fileName = document.getElementById('fileName');

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    fileName.textContent = file.name;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>

</html>
