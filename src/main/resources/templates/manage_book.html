<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Book | Bookstore Admin</title>
    
    <!-- Fonts from 2nd Code -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        /* --- GLOBAL BODY STYLES (2nd Code Look) --- */
        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            margin: 0;
            min-height: 100vh;
            
            /* Background Image & Gradient */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            /* Center the layout like the dashboard */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* aligns top so scrolling works better */
            padding: 40px 20px;
        }

        /* --- CONTAINER (Glassmorphism) --- */
        .container {
            width: 100%;
            max-width: 1000px; /* Slightly wider for the table */
            margin: 0 auto;
            
            /* Glass Effect */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px;
            
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- TYPOGRAPHY --- */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin: 10px 0 30px 0;
            letter-spacing: 1px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            margin-bottom: 40px;
        }

        /* --- SEARCH BAR (Styling from 2nd code) --- */
        .search-input {
            background: rgba(255, 255, 255, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
            font-family: 'Poppins', sans-serif !important;
        }
        
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7) !important;
            opacity: 1;
        }

        /* --- TABLE STYLING --- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 20px;
        }

        thead tr {
            background: rgba(76, 116, 134, 0.8); /* Blue-ish from 2nd code */
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 500;
        }

        tbody tr {
            background: rgba(255, 255, 255, 0.05); /* Slight row tint */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        td {
            padding: 15px;
        }

        /* Table Links */
        a.action-link {
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }
        
        a.modify-link { color: #4c7486; } /* Blue tone */
        a.modify-link:hover { color: #81a5b6; text-decoration: underline; }
        
        a.remove-link { color: #f39c12; } /* Orange tone */
        a.remove-link:hover { color: #ffb74d; text-decoration: underline; }


        /* --- FORM GRID & INPUTS --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 40px;
            margin: 30px auto;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Inputs matching the Search Bar style */
        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px; /* Pill shape */
            color: white;
            font-size: 0.95em;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        /* Textarea needs different radius usually, but keeping consistent pill style for top/bottom or just regular box */
        .form-field textarea {
            border-radius: 20px; /* Slightly softer */
            min-height: 80px;
            resize: vertical;
        }

        /* Select dropdown styling override for dark mode */
        .form-field select option {
            background-color: #2c3e50; /* Dark blue/grey for options */
            color: white;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        /* Checkbox styling */
        .form-field input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin-right: 10px;
            display: inline-block;
        }

        /* --- BUTTONS (Matching 2nd Code) --- */
        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        button, .btn-back {
            width: 300px;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Primary (Blue) */
        .btn-primary {
            background: rgba(76, 116, 134, 0.8);
            border: 1px solid rgba(76, 116, 134, 0.9);
        }
        .btn-primary:hover {
            background: rgba(76, 116, 134, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 116, 134, 0.4);
        }

        /* Secondary (Orange) */
        .btn-secondary {
            background: rgba(243, 156, 18, 0.8);
            border: 1px solid rgba(243, 156, 18, 0.9);
        }
        .btn-secondary:hover {
            background: rgba(243, 156, 18, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }

        .button-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        /* --- IMAGE PREVIEW --- */
        .image-preview {
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .image-preview img {
            max-width: 150px;
            border-radius: 10px;
            border: 3px solid rgba(76, 116, 134, 0.8);
        }

        /* Input type file styling fix */
        input[type="file"] {
            padding: 8px 0 !important;
            background: transparent !important;
        }

        /* Scrollbar styling for the table container */
        .inventory-section::-webkit-scrollbar {
            height: 8px;
        }
        .inventory-section::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <input type="hidden" id="successMessage" th:value="${successMsg}">
    <div class="container">
        <h1>MANAGE BOOK</h1>
        <div class="divider"></div>

        <!-- Search / Inventory Section -->
        <div class="inventory-section" style="margin-bottom: 50px;" th:if="${bookForm.bookID == 0}">
            <form th:action="@{/admin/books}" method="get"
                style="display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; align-items: center;">
                <input type="text" name="query" th:value="${currentQuery}" class="search-input"
                    placeholder="Search by Title, Author, or bookID..."
                    style="flex: 1; max-width: 500px;">
                <button type="submit" class="btn-primary" style="width: auto; padding: 12px 30px; border-radius: 50px;">FIND BOOK</button>
            </form>

            <div th:if="${allBooks != null}" style="overflow-x: auto; border-radius: 10px;">
                <h2 style="text-align: center; color: rgba(255, 255, 255, 0.8); font-size: 1.2em; margin-bottom: 20px;">SEARCH RESULTS
                </h2>

                <table th:if="${not #lists.isEmpty(allBooks)}">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>bookID</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${allBooks}">
                            <td style="font-weight: bold;" th:text="${book.title}"></td>
                            <td th:text="${book.bookID}"></td>
                            <td style="text-align: center;">
                                <a th:href="@{/admin/books/edit/{id}(id=${book.bookID})}"
                                    class="action-link modify-link" style="margin-right: 20px;">MODIFY</a>
                                <a th:href="@{/admin/books/delete/{id}(id=${book.bookID})}"
                                    onclick="return confirm('Remove this book?')"
                                    class="action-link remove-link">REMOVE</a>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:if="${#lists.isEmpty(allBooks)}" style="text-align: center; color: rgba(255, 255, 255, 0.6);">
                    No book found with that name or bookID.
                </p>
            </div>
        </div>

        <!-- Add/Modify Form -->
        <h2 style="text-align: center; color: rgba(255, 255, 255, 0.9); font-size: 1.5em; margin-top: 20px;"
            th:text="${bookForm.bookID > 0 ? 'MODIFY BOOK' : 'ADD NEW BOOK'}">
            ADD NEW BOOK
        </h2>
        <form th:action="@{/admin/books/add}" method="post" enctype="multipart/form-data" th:object="${bookForm}">
            <input type="hidden" th:field="*{bookID}">
            <input type="hidden" th:field="*{coverImageUrl}">
            
            <div class="form-grid">
                <div class="form-field">
                    <label>TITLE:</label>
                    <input type="text" th:field="*{title}" placeholder="Enter book title" required>
                </div>
                <div class="form-field">
                    <label>AUTHOR:</label>
                    <input type="text" th:field="*{author}" placeholder="Enter author name" required>
                </div>
                <div class="form-field">
                    <label>bookID:</label>
                    <input type="text" th:field="*{bookID}" placeholder="Enter bookID" required>
                </div>
                <div class="form-field">
                    <label>GENRE:</label>
                    <select th:field="*{genre}" required>
                        <option value="Classic Novel">Classic Novel</option>
                        <option value="Fantasy Novel">Fantasy Novel</option>
                        <option value="Personal Finance">Personal Finance</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="Programming">Programming</option>
                        <option value="History/Science">History/Science</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>PUBLISHER:</label>
                    <input type="text" th:field="*{publisher}" placeholder="Enter publisher">
                </div>
                <div class="form-field">
                    <label>PUBLISH YEAR:</label>
                    <input type="number" th:field="*{publicationYear}" placeholder="YYYY">
                </div>
                <div class="form-field">
                    <label>LANGUAGE:</label>
                    <input type="text" th:field="*{language}" placeholder="e.g. English">
                </div>
                <div class="form-field">
                    <label>PAGE COUNT:</label>
                    <input type="number" th:field="*{pageCount}" placeholder="0">
                </div>
                <div class="form-field">
                    <label>PRICE (RM):</label>
                    <input type="number" th:field="*{price}" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-field">
                    <label>STATUS:</label>
                    <select th:field="*{status}">
                        <option value="Available">Available</option>
                        <option value="Out of Stock">Out of Stock</option>
                    </select>
                </div>
                <div class="form-field full-width">
                    <label>TYPE (Format):</label>
                    <input type="text" th:field="*{type}" placeholder="e.g. Hardcover, E-Book">
                </div>
                <div class="form-field">
                    <label>
                        <input type="checkbox" th:field="*{isPromo}"> Mark as Promotion
                    </label>
                </div>
                <div class="form-field full-width">
                    <label>BOOK COVER:</label>

                    <div th:if="${bookForm.coverImageUrl != null}" style="margin-bottom: 10px;">
                        <p style="font-size: 0.8em; color: rgba(255,255,255,0.6);">Current Cover:</p>
                        <img th:src="${bookForm.coverImageUrl}" alt="Current Cover"
                            style="max-width: 100px; border-radius: 5px; border: 2px solid rgba(76, 116, 134, 0.8);">
                    </div>

                    <input type="file" name="file" accept="image/*" onchange="previewBookCover(event)">

                    <div class="image-preview" id="coverPreview">
                        <img id="previewImage" src="" alt="Preview">
                        <p id="fileName" style="color: rgba(255,255,255,0.7); font-size: 0.8em;"></p>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <div class="button-row">
                    <button type="reset" class="btn-secondary">RESET FORM</button>
                    <button type="submit" class="btn-primary"
                        th:text="${bookForm.bookID > 0 ? 'SAVE CHANGES' : 'ADD BOOK'}">ADD BOOK</button>
                </div>
                <a th:href="${bookForm.bookID > 0 ? '/admin/books' : '/admin/dashboard'}" class="btn-secondary btn-back"
                    th:text="${bookForm.bookID > 0 ? 'BACK' : 'BACK TO DASHBOARD'}">
                    BACK TO DASHBOARD
                </a>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        const msg = document.getElementById('successMessage').value;
        if (msg) {
            alert(msg);
        }
        function previewBookCover(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('coverPreview');
            const previewImage = document.getElementById('previewImage');
            const fileName = document.getElementById('fileName');
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    fileName.textContent = file.name;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>

</html>
