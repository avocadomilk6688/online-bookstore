<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Customer Portal</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0" th:text="'Welcome, ' + ${customer.email}"></h4>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Membership Status</div>
                        <div class="col-sm-8">
                            <span class="badge bg-primary" th:text="${customer.memberType}"></span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-4 text-muted">Mailing Address</div>
                        <div class="col-sm-8" th:text="${customer.address}"></div>
                    </div>
                </div>
                <div class="card-footer bg-light text-end">
                    <button class="btn btn-sm btn-outline-secondary">Edit Profile</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
