<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            margin-top: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .profile-header {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            display: block;
        }

        .form-control-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white !important;
            border-radius: 8px;
        }

        .form-control-glass:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
            box-shadow: none;
        }

        .id-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .btn-edit {
            background: white;
            color: black;
            font-weight: 600;
            border-radius: 50px;
            padding: 10px 25px;
            transition: 0.3s;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            background: #f1f1f1;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark glass-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/catalog}">📚 Bookstore Central</a>
        <div class="navbar-nav ms-auto">
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm rounded-pill px-4">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="profile-card">
                <div th:if="${param.success}" class="alert alert-success border-0 bg-success bg-opacity-25 text-white text-center mb-4">
                    <i class="bi bi-check-circle-fill me-2"></i> Profile updated successfully!
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h1 class="profile-header m-0 border-0" 
                        th:text="${customer.name != null && !customer.name.isEmpty() ? 'Welcome, ' + customer.name : 'Welcome, ' + customer.email}">
                        Welcome, User
                    </h1>
                    <span class="badge bg-info text-dark rounded-pill px-3 py-2" th:text="${customer.memberType}">PREMIUM</span>
                </div>
                
                <div class="border-bottom border-white opacity-25 mb-4"></div>

                <form th:action="@{/customer/updateProfile}" method="post">
                    <div class="row mt-4">
                        <div class="col-md-6 mb-4">
                            <p class="info-label">User ID</p>
                            <span class="id-badge" th:text="'#USR-' + ${customer.userID}">#USR-001</span>
                        </div>
                        <div class="col-md-6 mb-4">
                            <p class="info-label">Email Address (Login)</p>
                            <p class="info-value" th:text="${customer.email}">member@test.com</p>
                        </div>

                        <hr class="opacity-25 mb-4">

                        <div class="col-md-6 mb-3">
                            <label class="info-label">Full Name</label>
                            <input type="text" name="name" class="form-control form-control-glass" 
                                   th:value="${customer.name != null ? customer.name : 'Not set'}" placeholder="Enter your name">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="info-label">Birth Date</label>
                            <input type="date" name="birthDate" class="form-control form-control-glass" 
                                   th:value="${customer.birthDate}">
                        </div>

                        <div class="col-md-12 mb-4">
                            <label class="info-label">Billing Address</label>
                            <textarea name="address" class="form-control form-control-glass" rows="3" 
                                      th:text="${customer.address}">456 Library St</textarea>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <button type="submit" class="btn btn-edit me-2">Save Changes</button>
                        <a th:href="@{/catalog}" class="btn btn-outline-light rounded-pill px-4">Back to Shop</a>
                    </div>

                    <div th:if="${param.success}" class="alert alert-success border-0 bg-success bg-opacity-25 text-white text-center mb-4">
                         <i class="bi bi-check-circle-fill me-2"></i> Profile updated successfully!
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
