<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Order Status</title>
    <style>
        /* SAME CSS */
        body { font-family: 'Georgia', serif; background-color: #f5e6d3; padding: 20px; }
        .container { width: 100%; max-width: 900px; margin: 0 auto; background: white; padding: 30px; }
        h1 { text-align: center; font-size: 2.5em; margin: 30px 0; letter-spacing: 2px; }
        .divider { width: 100%; height: 3px; background-color: #000; margin-bottom: 50px; }
        
        .info-section { margin: 30px auto; max-width: 500px; }
        .info-row { display: flex; align-items: center; margin-bottom: 30px; }
        .info-row label { font-size: 1.3em; font-weight: bold; min-width: 150px; }
        .info-row input { flex: 1; padding: 12px 20px; border: none; border-radius: 25px; background-color: #b8a68f; color: #fff; font-size: 1em; font-family: 'Georgia', serif; }
        
        .order-details { background-color: #d4c4b0; padding: 30px; border-radius: 15px; margin: 30px auto; max-width: 600px; }
        .order-details h2 { font-size: 1.5em; margin-bottom: 20px; }
        .order-details p { font-size: 1.1em; margin: 10px 0; }
        
        .button-group { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 50px; }
        button { width: 200px; padding: 15px; border: none; border-radius: 30px; font-size: 1.1em; font-family: 'Georgia', serif; cursor: pointer; letter-spacing: 1px; }
        .btn-primary { background-color: #b8a68f; color: white; }
        .btn-secondary { background-color: #7a9098; color: white; }
        .button-row { display: flex; gap: 40px; justify-content: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>UPDATE ORDER STATUS</h1>
        <div class="divider"></div>

        <!-- SEARCH FORM -->
        <form th:action="@{/admin/orders}" method="post">
            <div class="info-section">
                <div class="info-row">
                    <label>ORDER ID:</label>
                    <input type="number" name="orderId" placeholder="Enter Order ID">
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button type="submit" class="btn-primary">FETCH ORDER</button>
                </div>
            </div>
        </form>

        <!-- DISPLAY ORDER DETAILS (Only shows if order found) -->
        <div th:if="${order}" class="order-details">
            <h2>ORDER DETAILS:</h2>
            <p><strong>Order ID:</strong> <span th:text="${order.orderID}"></span></p>
            <p><strong>Customer:</strong> <span th:text="${order.customerName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${order.userEmail}"></span></p>
            <p><strong>Total Price:</strong> RM<span th:text="${order.totalPrice}"></span></p>
            <p><strong>Delivery Address:</strong> <span th:text="${order.deliveryAddress}"></span></p>
            <p><strong>Order Date:</strong> <span th:text="${order.orderDate}"></span></p>
            <p><strong>Current Status:</strong> <span th:text="${order.status}"></span></p>
            <hr style="margin: 20px 0; border: 1px solid #b8a68f;">
            <h3>Order Items:</h3>
            <div th:each="item : ${order.items}">
                <p style="margin: 8px 0;">
                    <span th:text="${item.title}"></span> (ISBN: <span th:text="${item.isbn}"></span>)<br>
                    &nbsp;&nbsp;&nbsp;&nbsp;Quantity: <span th:text="${item.quantity}"></span> × <span th:text="${item.price}"></span> = <span th:text="${item.quantity * item.price}"></span>
                </p>
            </div>
        </div>

        <!-- UPDATE FORM (Only shows if order found) -->
        <div th:if="${order}" class="info-section">
            <form th:action="@{/admin/orders/update}" method="post">
                <input type="hidden" name="orderID" th:value="${order.orderID}">
                <div class="info-row">
                    <label>ORDER STATUS:</label>
                    <select name="status">
                        <option value="">Select Status</option>
                        <option value="PLACED">PLACED</option>
                        <option value="SHIPPED">SHIPPED</option>
                        <option value="OUT_FOR_DELIVERY">OUT FOR DELIVERY</option>
                        <option value="DELIVERED">DELIVERED</option>
                    </select>
                </div>
                <div class="button-group" style="margin-top: 20px;">
                    <div class="button-row">
                        <a th:href="@{/admin/dashboard}" class="btn-primary" style="text-decoration:none; color:white;">CANCEL</a>
                        <button type="submit" class="btn-primary">UPDATE</button>
                    </div>
                </div>
            </form>
        </div>
        
        <!-- BACK BUTTON (Always visible) -->
        <div class="button-group" th:unless="${order}">
            <a th:href="@{/admin/dashboard}" class="btn-secondary" style="text-decoration: none; color: white;">BACK</a>
        </div>

    </div>

</body>
</html>
