<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | Bookstore</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-control-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white !important;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .form-control-glass:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #f39c12;
            box-shadow: 0 0 0 0.2rem rgba(243, 156, 18, 0.25);
            color: white !important;
        }

        .form-control-glass::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.75rem;
        }

        .payment-option:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .payment-option.selected {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }

        .payment-option input[type="radio"] {
            margin-right: 1rem;
            transform: scale(1.3);
            accent-color: #f39c12;
        }

        .payment-details {
            display: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .payment-details.active {
            display: block;
        }

        .bank-option {
            padding: 0.75rem 1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .bank-option:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .bank-option.selected {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }

        .bank-option input {
            display: none;
        }

        .order-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-image {
            width: 50px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 1rem;
            background: rgba(0, 0, 0, 0.3);
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }

        .price-row.discount {
            color: #2ecc71;
        }

        .price-row.total {
            font-size: 1.3rem;
            font-weight: bold;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            padding-top: 1rem;
            margin-top: 0.5rem;
        }

        .savings-badge {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.5);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-top: 1rem;
        }

        .member-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn-place-order {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: white;
            font-weight: 600;
            padding: 1rem;
            border-radius: 50px;
            font-size: 1.1rem;
            width: 100%;
            transition: 0.3s;
        }

        .btn-place-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
            color: white;
        }

        .error-alert {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/catalog}">📚 Bookstore Central</a>
            <div class="navbar-nav ms-auto gap-3">
                <a th:href="@{/cart}" class="nav-link"><i class="bi bi-cart3"></i> Cart</a>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm rounded-pill px-4">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div th:if="${error}" class="error-alert text-center" th:text="${error}"></div>

        <form th:action="@{/checkout/confirm}" method="post" id="checkoutForm">
            <div class="row">
                <!-- Left Column -->
                <div class="col-lg-7">
                    <!-- Delivery Address -->
                    <div class="glass-card">
                        <h2 class="section-title"><i class="bi bi-geo-alt me-2"></i>Delivery Address</h2>
                        <textarea name="deliveryAddress" class="form-control form-control-glass" rows="3" required
                            th:text="${defaultAddress}" placeholder="Enter your full delivery address"></textarea>
                    </div>

                    <!-- Payment Method -->
                    <div class="glass-card">
                        <h2 class="section-title"><i class="bi bi-credit-card me-2"></i>Payment Method</h2>

                        <label class="payment-option selected" onclick="selectPayment('COD')">
                            <input type="radio" name="paymentMethod" value="COD" checked>
                            <div>
                                <strong>Cash on Delivery</strong>
                                <div class="small opacity-75">Pay when you receive your order</div>
                            </div>
                        </label>

                        <label class="payment-option" onclick="selectPayment('FPX')">
                            <input type="radio" name="paymentMethod" value="FPX">
                            <div>
                                <strong>FPX Online Banking</strong>
                                <div class="small opacity-75">Direct bank transfer</div>
                            </div>
                        </label>

                        <label class="payment-option" onclick="selectPayment('CREDIT_CARD')">
                            <input type="radio" name="paymentMethod" value="CREDIT_CARD">
                            <div>
                                <strong>Credit/Debit Card</strong>
                                <div class="small opacity-75">Visa, Mastercard accepted</div>
                            </div>
                        </label>

                        <!-- COD Details -->
                        <div id="cod-details" class="payment-details active">
                            <p class="mb-0 opacity-75"><i class="bi bi-info-circle me-2"></i>Payment will be collected
                                by the courier upon delivery.</p>
                        </div>

                        <!-- FPX Details -->
                        <div id="fpx-details" class="payment-details">
                            <label class="mb-3">Select Your Bank</label>
                            <div class="row g-2">
                                <div class="col-6"><label class="bank-option d-block" onclick="selectBank('MBB')"><input
                                            type="radio" name="bankCode" value="MBB">Maybank</label></div>
                                <div class="col-6"><label class="bank-option d-block"
                                        onclick="selectBank('CIMB')"><input type="radio" name="bankCode"
                                            value="CIMB">CIMB</label></div>
                                <div class="col-6"><label class="bank-option d-block" onclick="selectBank('PBB')"><input
                                            type="radio" name="bankCode" value="PBB">Public Bank</label></div>
                                <div class="col-6"><label class="bank-option d-block" onclick="selectBank('RHB')"><input
                                            type="radio" name="bankCode" value="RHB">RHB Bank</label></div>
                                <div class="col-6"><label class="bank-option d-block" onclick="selectBank('HLB')"><input
                                            type="radio" name="bankCode" value="HLB">Hong Leong</label></div>
                                <div class="col-6"><label class="bank-option d-block"
                                        onclick="selectBank('AMBANK')"><input type="radio" name="bankCode"
                                            value="AMBANK">AmBank</label></div>
                            </div>
                        </div>

                        <!-- Credit Card Details -->
                        <div id="card-details" class="payment-details">
                            <div class="mb-3">
                                <label class="small opacity-75 mb-1">Card Number</label>
                                <input type="text" name="cardNumber" class="form-control form-control-glass"
                                    placeholder="1234 5678 9012 3456" maxlength="19">
                            </div>
                            <div class="mb-3">
                                <label class="small opacity-75 mb-1">Cardholder Name</label>
                                <input type="text" name="cardHolder" class="form-control form-control-glass"
                                    placeholder="Name on card">
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <label class="small opacity-75 mb-1">Expiry Date</label>
                                    <input type="text" name="expiryDate" class="form-control form-control-glass"
                                        placeholder="MM/YY" maxlength="5">
                                </div>
                                <div class="col-6">
                                    <label class="small opacity-75 mb-1">CVV</label>
                                    <input type="text" name="cvv" class="form-control form-control-glass"
                                        placeholder="123" maxlength="4">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column - Order Summary -->
                <div class="col-lg-5">
                    <div class="glass-card">
                        <h2 class="section-title"><i class="bi bi-receipt me-2"></i>Order Summary</h2>

                        <div th:each="item : ${summary.items}" class="order-item">
                            <img th:if="${item.coverImageUrl}" th:src="${item.coverImageUrl}" class="order-item-image">
                            <div th:unless="${item.coverImageUrl}"
                                class="order-item-image d-flex align-items-center justify-content-center">
                                <i class="bi bi-book opacity-50"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="fw-bold small" th:text="${item.title}">Book</div>
                                <div class="small opacity-75">Qty: <span th:text="${item.quantity}">1</span></div>
                            </div>
                            <div class="fw-bold">RM <span
                                    th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></div>
                        </div>

                        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                            <div class="price-row">
                                <span>Subtotal</span>
                                <span>RM <span
                                        th:text="${#numbers.formatDecimal(summary.subtotal, 1, 2)}">0.00</span></span>
                            </div>

                            <div th:if="${summary.hasDiscount()}" class="price-row discount">
                                <span>Discount (<span th:text="${summary.discountPercentage}">0%</span>)</span>
                                <span>- RM <span
                                        th:text="${#numbers.formatDecimal(summary.discount, 1, 2)}">0.00</span></span>
                            </div>

                            <div class="price-row">
                                <span>Shipping</span>
                                <span class="text-success">FREE</span>
                            </div>

                            <div class="price-row total">
                                <span>Total</span>
                                <span>RM <span
                                        th:text="${#numbers.formatDecimal(summary.finalPrice, 1, 2)}">0.00</span></span>
                            </div>
                        </div>

                        <div th:if="${summary.hasDiscount()}" class="savings-badge">
                            <i class="bi bi-tag-fill me-2"></i>
                            <strong>You saved RM <span
                                    th:text="${#numbers.formatDecimal(summary.discount, 1, 2)}">0.00</span>!</strong>
                            <span th:if="${summary.memberType == 'PREMIUM'}" class="member-badge ms-2">PREMIUM</span>
                        </div>

                        <button type="submit" class="btn-place-order mt-4">
                            <i class="bi bi-bag-check me-2"></i>Place Order
                        </button>

                        <a th:href="@{/cart}" class="btn btn-link text-white-50 d-block text-center mt-3">
                            <i class="bi bi-arrow-left me-1"></i>Back to Cart
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script>
        function selectPayment(method) {
            document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
            event.currentTarget.classList.add('selected');

            document.querySelectorAll('.payment-details').forEach(d => d.classList.remove('active'));

            if (method === 'COD') {
                document.getElementById('cod-details').classList.add('active');
            } else if (method === 'FPX') {
                document.getElementById('fpx-details').classList.add('active');
            } else if (method === 'CREDIT_CARD') {
                document.getElementById('card-details').classList.add('active');
            }
        }

        function selectBank(bank) {
            document.querySelectorAll('.bank-option').forEach(opt => opt.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
        }
    </script>

</body>

</html>
