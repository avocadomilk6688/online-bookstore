<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalog | Bookstore</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,search,shopping_cart" />

    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
            margin: 0;
        }

        /* --- Header / Navbar Area --- */
        .glass-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Styling for the new Material Symbols buttons */
        .glass-header span.material-symbols-outlined {
            cursor: pointer;
        }

        /* Specific sizing to make account_circle look balanced */
        .fs-1 {
            font-size: 32px !important;
        }

        .fs-2 {
            font-size: 28px !important;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 5px 20px;
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            width: 90%;
            outline: none;
        }

        .material-symbols-outlined {
            cursor: pointer;
            font-size: 24px;
        }

        /* --- Main Layout: Sidebar + Grid --- */
        .main-layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* --- Sidebar Categories --- */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
        }

        .category-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            padding: 0 30px 20px 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .category-item {
            padding: 15px 30px;
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: 0.3s;
            font-weight: 400;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding-left: 40px;
        }

        /* --- Book Grid Area --- */
        .content-area {
            flex-grow: 1;
            padding: 40px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .book-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .book-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .book-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .btn-details {
            background: rgba(76, 116, 134, 0.8);
            color: white;
            border: none;
            padding: 8px 30px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-details:hover {
            background: rgba(76, 116, 134, 1);
            transform: scale(1.05);
            color: white;
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <header class="glass-header">
        <div class="d-flex align-items-center">
            <i class="bi bi-list fs-2 me-3" style="cursor: pointer;"></i>
            <h4 class="m-0 font-playfair">Online Bookstore</h4>
        </div>

        <form th:action="@{/catalog}" method="get" class="search-bar" style="width: 50%;">
            <input type="text" name="search" placeholder="Search for titles, authors or ISBN..."
                th:value="${param.search}"
                style="width: 90%; background: transparent; border: none; color: white; outline: none;">

            <button type="submit"
                style="background: none; border: none; color: white; display: flex; align-items: center; padding: 0;">
                <span class="material-symbols-outlined">search</span>
            </button>
        </form>

        <div class="d-flex align-items-center gap-4">
            <a href="#" class="text-white text-decoration-none d-flex align-items-center">
                <span class="material-symbols-outlined fs-2">shopping_cart</span>
            </a>
            <a th:href="@{/customer/profile}" class="text-white text-decoration-none d-flex align-items-center">
                <span class="material-symbols-outlined fs-1">account_circle</span>
            </a>
        </div>
    </header>
    
    <div class="main-layout">
        <aside class="sidebar">
            <div class="category-header">Categories</div>
            <a th:href="@{/catalog}" class="category-item" style="cursor: pointer;">All Books</a>
            <a th:href="@{/catalog(genre='Classic Novel')}" class="category-item">Classic Novel</a>
            <a th:href="@{/catalog(genre='Fantasy Novel')}" class="category-item">Fantasy Novel</a>
            <a th:href="@{/catalog(genre='Personal Finance')}" class="category-item">Personal Finance</a>
            <a th:href="@{/catalog(genre='Self-Help')}" class="category-item">Self-Help</a>
            <a th:href="@{/catalog(genre='Programming')}" class="category-item">Programming</a>
            <a th:href="@{/catalog(genre='History/Science')}" class="category-item">History/Science</a>
        </aside>

        <main class="content-area">
            <div class="book-grid">
                <div class="book-card" th:each="book : ${books}">
                    <img th:src="@{${book.coverImageUrl}}" alt="Book Cover">
                    <div class="book-title" th:text="${book.title}">Book Title</div>
                    <div class="book-author" th:text="'by ' + ${book.author}">Author Name</div>
                    <div class="book-price" style="font-weight: 600; color: #f39c12; margin-top: 5px;"
                        th:text="'RM ' + ${#numbers.formatDecimal(book.price, 1, 2)}">
                        RM 0.00
                    </div>
                    <div class="mt-3">
                        <a th:href="@{/book-details(id=${book.bookID})}" class="btn-details">View Details</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
