<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            /* Replace the URL below with your actual image path (e.g., /images/library.jpg) */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
        }

        .welcome-text {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            margin-top: 50px;
        }

        /* Glassmorphism Card: Semi-transparent to match background */
        .auth-card {
            max-width: 450px;
            width: 90%;
            margin: auto;
            background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
            backdrop-filter: blur(15px); /* Blurs the background behind the card */
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white !important;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: none;
            border: 1px solid white;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #333;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #f1f1f1;
            color: #000;
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        a.text-primary {
            color: #ffffff !important;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <h1 class="welcome-text">Welcome to Online Bookstore</h1>

    <div class="auth-card text-start">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Login</h2>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email or User ID</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter Email or ID" required/>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required/>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Login As</label>
                <div class="d-flex gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleUser" value="MEMBER" checked>
                        <label class="form-check-label" for="roleUser">Member</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="ADMIN">
                        <label class="form-check-label" for="roleAdmin">Admin</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Sign In</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted small">
            Don't have an account? <a th:href="@{/customer/register}" class="fw-bold text-primary">Register</a>
        </p>
    </div>
</div>

</body>
</html>
