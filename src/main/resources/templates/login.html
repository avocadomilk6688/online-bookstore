<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            /* Replace the URL below with your actual image path (e.g., /images/library.jpg) */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
        }

        .welcome-text {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            margin-top: 50px;
        }

        .auth-card {
            max-width: 450px;
            width: 90%;
            margin: auto;
            background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
            backdrop-filter: blur(15px); /* Blurs the background behind the card */
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white !important;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: none;
            border: 1px solid white;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #333;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #f1f1f1;
            color: #000;
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        a.text-primary {
            color: #ffffff !important;
            text-decoration: underline;
        }

        .seamless-glass {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px !important; 
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .seamless-glass .form-control, 
        .seamless-glass .input-group-text {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            color: white !important;
        }
        
        .seamless-glass .input-group-text {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .seamless-glass:focus-within {
            background: rgba(255, 255, 255, 0.2) !important;
            border-color: rgba(255, 255, 255, 0.5);
        }

        .seamless-glass .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.2) !important;
            border: none;
            border-radius: 0.5rem; /* Matches Bootstrap lg input radius */
        }

        .input-group > .form-control {
            border-left: none !important;
            border-right: none !important;
        }

        .input-group-text i {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <h1 class="welcome-text">Welcome to Online Bookstore</h1>

    <div class="auth-card text-start">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Login</h2>
        </div>

        <div th:if="${error}" class="alert alert-danger p-2 text-center" 
             style="background: rgba(255, 0, 0, 0.2); border: none; color: white; font-size: 0.85rem;">
            <span th:text="${error}"></span>
        </div>

        <div th:if="${param.registered}" class="alert alert-success p-2 text-center" 
            style="background: rgba(40, 167, 69, 0.2); border: none; color: white; font-size: 0.85rem;">
            Registration successful! Please login.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-white-50 small">Email or User ID</label>
                <div class="input-group seamless-glass">
                    <span class="input-group-text border-0 bg-transparent ps-3">
                        <i class="bi bi-person text-white"></i> </span>
                    <input type="text" name="username" class="form-control border-0 bg-transparent text-white py-2" 
                        placeholder="Enter Email" required/>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-white-50 small">Password</label>
                <div class="input-group seamless-glass">
                    <span class="input-group-text border-0 bg-transparent ps-3">
                        <i class="bi bi-lock text-white"></i>
                    </span>
                    <input type="password" name="password" id="loginPassword" 
                           class="form-control border-0 bg-transparent text-white py-2" 
                           placeholder="Minimum 6 characters" minlength="6" required/>
                    <span class="input-group-text border-0 bg-transparent pe-3" 
                          style="cursor: pointer;" onclick="toggleLoginPassword()">
                        <i class="bi bi-eye-slash text-white-50" id="toggleIcon"></i>
                    </span>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Login As</label>
                <div class="d-flex gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleUser" value="MEMBER" checked>
                        <label class="form-check-label" for="roleUser">Member</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="ADMIN">
                        <label class="form-check-label" for="roleAdmin">Admin</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Sign In</button>
        </form>

        <p class="text-center mt-4 mb-0 text-muted small">
            Don't have an account? <a th:href="@{/customer/register}" class="fw-bold text-primary">Register</a>
        </p>
    </div>
</div>

</body>
<script>
    function toggleLoginPassword() {
        const passwordField = document.getElementById('loginPassword');
        const toggleIcon = document.getElementById('toggleIcon');
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
            toggleIcon.classList.replace('text-white-50', 'text-white');
        } else {
            passwordField.type = 'password';
            toggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
            toggleIcon.classList.replace('text-white', 'text-white-50');
        }
    }
</script>
</html>
