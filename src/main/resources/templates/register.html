<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            /* Keep the background identical to your login page */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 40px 0;
        }

        .reg-card {
            max-width: 650px;
            width: 95%;
            margin: auto;
            background: rgba(255, 255, 255, 0.12); /* Glass effect */
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            color: white;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .section-divider {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin: 25px 0 15px 0;
            padding-bottom: 5px;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white !important;
        }

        /* Styling for the dropdown options so they are readable */
        .form-select option {
            background-color: #333; 
            color: white;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            box-shadow: none;
        }

        .btn-register {
            background-color: #28a745;
            color: white;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-register:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="reg-card text-start">
        <h2 class="page-title text-center">Create Account</h2>

        <div th:if="${error}" class="alert alert-danger p-2 text-center" 
            style="background: rgba(220, 53, 69, 0.2); border: none; color: white; font-size: 0.85rem;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

    <form id="registrationForm" th:action="@{/customer/register}" method="post">            
            <div class="section-divider">Account Credentials</div>
            <div class="row">
               <div class="col-md-12 mb-3">
                   <label class="form-label">Name</label>
                       <input name="name" type="text" class="form-control" placeholder="Enter your full name" required/>
                   </div>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Email Address</label>
                    <input name="email" type="email" class="form-control" placeholder="user@example.com" required/>
                </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input id="password" name="password" type="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required/>
                    <span class="input-group-text bg-transparent border-start-0" style="cursor: pointer;" onclick="togglePassword('password', 'eyeIcon1')">
                        <i class="bi bi-eye-slash text-white" id="eyeIcon1"></i>
                    </span>
                </div>
            </div>
            <form id="registrationForm" th:action="@{/customer/register}" method="post">
                <input type="hidden" name="role" value="MEMBER">
            <div class="col-md-6 mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                    <input id="confirm_password" name="confirmPassword"type="password" class="form-control" placeholder="Repeat password" required/>
                    <span class="input-group-text bg-transparent border-start-0" style="cursor: pointer;" onclick="togglePassword('confirm_password', 'eyeIcon2')">
                        <i class="bi bi-eye-slash text-white" id="eyeIcon2"></i>
                    </span>
                </div>
                <div id="password_error" class="text-danger small mt-1" style="display:none;">Passwords do not match</div>
            </div>  
            <div class="section-divider">Profile Details</div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Membership Type</label>
                    <select name="memberType" class="form-select" required>
                        <option value="STANDARD">Standard</option>
                        <option value="PREMIUM">Premium</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input name="birthDate" type="date" class="form-control" required/>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Residential Address</label>
                    <textarea name="address" class="form-control" rows="2" placeholder="Full Address..." required></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-register btn-lg w-100 mt-4 shadow-sm">Register Now</button>
        </form>

        <div class="text-center mt-4">
            <a th:href="@{/login}" class="text-white-50 text-decoration-none small">Already have an account? <span class="text-white fw-bold">Login</span></a>
        </div>
    </div>
</div>
<script>

    // 1. Password Visibility Toggle Function
    function togglePassword(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
        }
    }

    // 2. Password Matching Logic
    const form = document.getElementById('registrationForm');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm_password');
    const errorMsg = document.getElementById('password_error');

    form.addEventListener('submit', function(e) {
        if (password.value !== confirm.value) {
            e.preventDefault(); // Stop form submission
            errorMsg.style.display = 'block';
            confirm.style.borderColor = '#ff4d4d';
        }
    });

    confirm.addEventListener('input', function() {
        if (password.value === confirm.value) {
            errorMsg.style.display = 'none';
            confirm.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        }
    });
</script>

</body>
</html>
